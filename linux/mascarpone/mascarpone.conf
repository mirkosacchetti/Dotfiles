# Mascarpone, the mpd client: ~/.config/mascarpone/mascarpone.conf
# key = value under [section]; # starts a comment. A key left out keeps
# its default, the one written here.

[mpd]
# a host name, or a socket's path (/run/mpd/socket); MPD_HOST and
# MPD_PORT, as mpc reads them, win when set
host = localhost
port = 6600
# password =

[library]
# mpd's music_directory: the covers found on the net are written there
music = ~/Music
# the m3u playlists
playlists = ~/Music/Playlists

[keys]
# an action = its keys, by spaces; nothing after = no key.
# A character as the layout writes it (K is Shift+k); Ctrl+, Alt+ and
# Shift+ before a named key: Space Enter Escape Tab Backspace Delete
# Up Down Left Right PageUp PageDown Home End KP_Add KP_Subtract KP_0.

# anywhere; each one, with its keys, in the commands' picker
commands = Ctrl+k
search_all = /
search = Ctrl+f
albums = 1
artists = 2
playlists = 3
queue = 4
next_tab = Ctrl+Tab
previous_tab = Ctrl+Shift+Tab
back = Escape
play_pause = Space c
stop = x
previous = z
next = v
seek_forward = ]
seek_backward = [
volume_up = + =
volume_down = -
repeat = r
repeat_one = R
go_to_playing = g
save_queue =
clear_queue =
refresh = Ctrl+r
zoom_in = Ctrl+= Ctrl++ Ctrl+KP_Add
zoom_out = Ctrl+- Ctrl+KP_Subtract
zoom_reset = Ctrl+0 Ctrl+KP_0
quit = Ctrl+q

# the grids and the lists
left = j Left
right = ; Right
down = k Down
up = l Up
open = Enter
# a track's: to a playlist; the queue's rows: out, down, up
add_to_playlist = a
remove = d Delete
move_down = K
move_up = L

# the picker and the dialogs
picker_next = Down Tab Ctrl+n Ctrl+k
picker_previous = Up Shift+Tab Ctrl+p Ctrl+l
picker_page_down = PageDown
picker_page_up = PageUp
picker_open = Enter
picker_close = Escape Ctrl+g
